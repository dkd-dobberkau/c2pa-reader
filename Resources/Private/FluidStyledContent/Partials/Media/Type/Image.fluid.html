<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:ce="http://typo3.org/ns/TYPO3/CMS/FluidStyledContent/ViewHelpers" data-namespace-typo3-fluid="true">
<f:comment>
    Copy of EXT:fluid_styled_content/Resources/Private/Partials/Media/Type/Image.fluid.html (TYPO3 14.3).
    Added: AI notice (c2pa:badge) in the figcaption, so it belongs to the image semantically.
</f:comment>
<f:variable name="c2paBadge"><c2pa:badge file="{file}" /></f:variable>
<figure class="image">
    <f:if condition="{file.link}">
        <f:then>
            <f:link.typolink parameter="{file.link}" title="{file.title}">
                <f:render partial="Media/Rendering/Image" arguments="{file: file, dimensions: dimensions, settings: settings}" />
            </f:link.typolink>
        </f:then>
        <f:else>
            <f:if condition="{data.image_zoom}">
                <f:then>
                    <ce:link.clickEnlarge image="{file}" configuration="{settings.media.popup}">
                        <f:render partial="Media/Rendering/Image" arguments="{file: file, dimensions: dimensions, settings: settings}" />
                    </ce:link.clickEnlarge>
                </f:then>
                <f:else>
                    <f:render partial="Media/Rendering/Image" arguments="{file: file, dimensions: dimensions, settings: settings}" />
                </f:else>
            </f:if>
        </f:else>
    </f:if>
    <f:if condition="{file.description} || {c2paBadge}">
        <figcaption class="image-caption">
            <f:if condition="{file.description}">{file.description -> f:format.nl2br()}</f:if>
            <f:format.raw>{c2paBadge}</f:format.raw>
        </figcaption>
    </f:if>
</figure>
</html>
