services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Dkd\C2paReader\:
    resource: '../Classes/*'

  # ViewHelpers with constructor injection must be public so that Fluid gets them from the container.
  Dkd\C2paReader\ViewHelpers\:
    resource: '../Classes/ViewHelpers/*'
    public: true
    shared: false

  # Settings from ext_conf_template.txt, with defaults when the extension is not configured yet.
  Dkd\C2paReader\Configuration\ExtensionSettings:
    factory: ['Dkd\C2paReader\Configuration\ExtensionSettings', 'fromExtensionConfiguration']
